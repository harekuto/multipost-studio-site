name: Build WillLock APK PR

on:
  pull_request:
    branches:
      - main
    paths:
      - 'willlock-ci/**'
      - '.github/workflows/willlock-apk-pr.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p willlock-ci --no-daemon clean assembleDebug
      - name: Verify APK
        shell: bash
        run: |
          APK=willlock-ci/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | head -20
          cp "$APK" WillLock-1.0.2.apk
          sha256sum WillLock-1.0.2.apk > WillLock-1.0.2.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: WillLock-1.0.2-apk
          path: |
            WillLock-1.0.2.apk
            WillLock-1.0.2.apk.sha256
          if-no-files-found: error
